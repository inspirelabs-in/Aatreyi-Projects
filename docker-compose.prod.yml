# Production overlay — use alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Changes from dev:
#   - nginx on port 80 is the single public entry point
#   - UI built with NEXT_PUBLIC_API_BASE="" (relative /api calls via nginx)
#   - CORS opened for the server domain
#   - 8000 / 3000 not exposed directly

services:
  nginx:
    image: nginx:alpine
    container_name: tga_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ui
    restart: unless-stopped

  api:
    ports: []
    environment:
      ALLOWED_ORIGINS: "*"

  ui:
    ports: []
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
    env_file: []
    environment:
      NEXT_PUBLIC_API_BASE: ""
