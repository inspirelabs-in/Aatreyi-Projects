services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telegram_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/telegram_agent
    volumes:
      - ./data/sessions:/app/data/sessions
      - ./data/logs:/app/data/logs
    command: ["--schedule"]

volumes:
  pgdata:
